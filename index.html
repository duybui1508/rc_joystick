<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Joystick Xe 2WD</title>
<style>
  :root {
    --bg: #eef1f4; --panel: #fff; --ink: #17202a; --muted: #5b6673; --line: #cfd6de;
    --accent: #e0a300; --stop: #c8243a; --ok: #1b8f5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: center; gap: 10px; }
  h1 { font-size: 20px; margin: 0 auto 0 0; }
  #status { font-size: 13px; color: var(--muted); }
  #status.on { color: var(--ok); font-weight: 600; }
  button {
    font: 600 15px system-ui, sans-serif; padding: 12px 16px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); touch-action: manipulation;
  }
  #connectBtn { background: var(--accent); border-color: var(--accent); }
  #stopBtn { width: 100%; padding: 16px; font-size: 20px; border: 0; background: var(--stop); color: #fff; }
  #hornBtn.on { background: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Can lai */
  #pad {
    position: relative; width: min(80vw, 300px); aspect-ratio: 1; margin: 0 auto;
    border-radius: 50%; background: var(--panel); border: 1px solid var(--line); touch-action: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 36%; aspect-ratio: 1; border-radius: 50%;
    background: var(--accent); transform: translate(-50%, -50%); pointer-events: none;
    box-shadow: 0 6px 16px rgba(0,0,0,.25);
  }
  .label { position: absolute; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--muted); }
  #readout { text-align: center; font: 14px ui-monospace, Menlo, monospace; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .panel label { display: flex; justify-content: space-between; font-weight: 600; font-size: 14px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #log { margin: 0; height: 5.5em; overflow: auto; font: 12px ui-monospace, Menlo, monospace; color: var(--muted); white-space: pre-wrap; }
  #noBle { background: #fde2e5; padding: 10px; border-radius: 8px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Joystick Xe 2WD</h1>
    <span id="status">Chưa kết nối</span>
    <button id="connectBtn">Kết nối</button>
  </header>

  <p id="noBle" hidden>Trình duyệt này không hỗ trợ Bluetooth. Trên iPhone hãy mở trang bằng app <b>Bluefy</b>.</p>

  <div id="pad">
    <span class="label" style="top:6px">TIẾN</span>
    <span class="label" style="bottom:6px">LÙI</span>
    <div id="knob"></div>
  </div>
  <div id="readout">Trái 0% · Phải 0%</div>

  <button id="stopBtn">DỪNG</button>
  <div class="row">
    <button id="hornBtn">Còi (giữ)</button>
    <button id="lightBtn">Đèn: đổi chế độ</button>
  </div>

  <div class="panel">
    <label>Tốc độ tối đa <span id="maxOut"></span></label>
    <input id="maxSpd" type="range" min="30" max="100" value="80">
    <label>Mức khởi động <span id="minOut"></span></label>
    <input id="minSpd" type="range" min="0" max="70" value="50">
    <label>Bù lệch (+ giảm bánh phải, − giảm bánh trái) <span id="trimOut"></span></label>
    <input id="trim" type="range" min="-15" max="15" value="0">
    <pre id="log"></pre>
  </div>
</div>

<script>
/* ===================== CẤU HÌNH ===================== */
const SERVICE_UUID = 0xFFE0;   // dịch vụ UART của module BT05
const CHAR_UUID    = 0xFFE1;   // kênh gửi / nhận dữ liệu
const SEND_EVERY_MS = 50;      // gửi lệnh joystick 20 lần mỗi giây

/* ===================== BIẾN ===================== */
let characteristic = null;     // kênh BLE để ghi dữ liệu
let holding = false;           // đang giữ cần lái hay không
let joyX = 0, joyY = 0;        // vị trí cần lái, từ -1 đến 1
let left = 0, right = 0;       // tốc độ 2 bánh, từ -100 đến 100
let sending = false;           // đang gửi dở một lệnh

const $ = id => document.getElementById(id);

/* ===================== GHI LOG ===================== */
function log(text) {
  const box = $('log');
  box.textContent = (box.textContent + text + '\n').split('\n').slice(-6).join('\n');
}

/* ===================== KẾT NỐI BLUETOOTH ===================== */
async function connect() {
  if (!navigator.bluetooth) { $('noBle').hidden = false; return; }
  try {
    $('status').textContent = 'Đang kết nối…';
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [SERVICE_UUID]
    });
    device.addEventListener('gattserverdisconnected', onDisconnect);

    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHAR_UUID);

    // Nhận chữ xe gửi về (READY, DEN = ...) để hiện lên log
    await characteristic.startNotifications();
    characteristic.addEventListener('characteristicvaluechanged', e => {
      log('Xe: ' + new TextDecoder().decode(e.target.value).trim());
    });

    $('status').textContent = 'Đã kết nối';
    $('status').className = 'on';
    $('connectBtn').textContent = 'Ngắt';
  } catch (err) {
    log('Không kết nối được: ' + err.message);
    $('status').textContent = 'Chưa kết nối';
  }
}

function onDisconnect() {
  characteristic = null;
  $('status').textContent = 'Mất kết nối';
  $('status').className = '';
  $('connectBtn').textContent = 'Kết nối';
}

/* Gửi một chuỗi lệnh xuống xe */
async function send(text) {
  if (!characteristic) return;
  for (let i = 0; i < 10 && sending; i++) await new Promise(r => setTimeout(r, 15));   // chờ lệnh trước gửi xong
  sending = true;
  try {
    await characteristic.writeValueWithoutResponse(new TextEncoder().encode(text + '\n'));
  } catch (err) {
    log('Lỗi gửi: ' + err.message);
  }
  sending = false;
}

/* ===================== TÍNH TỐC ĐỘ 2 BÁNH =====================
   Kéo lên  (joyY > 0): 2 bánh cùng tiến.
   Kéo ngang (joyX):    bánh này nhanh hơn bánh kia nên xe rẽ.
   left  = joyY + joyX
   right = joyY - joyX                                            */
function computeWheels() {
  const maxSpeed = +$('maxSpd').value;
  const minSpeed = +$('minSpd').value;
  const trim     = +$('trim').value;

  let l = joyY + joyX;
  let r = joyY - joyX;

  // Không cho vượt quá 1
  const biggest = Math.max(1, Math.abs(l), Math.abs(r));
  l = l / biggest;
  r = r / biggest;

  // Đổi từ -1..1 sang phần trăm. Có mức khởi động để motor qua L298N đủ lực quay.
  left  = toPercent(l, minSpeed, maxSpeed);
  right = toPercent(r, minSpeed, maxSpeed);

  // Bù lệch: xe đi lệch thì giảm bớt bánh chạy nhanh hơn
  if (trim > 0) right = Math.round(right * (1 - trim / 100));
  if (trim < 0) left  = Math.round(left  * (1 + trim / 100));

  $('readout').textContent = `Trái ${left}% · Phải ${right}%`;
}

function toPercent(value, minSpeed, maxSpeed) {
  if (Math.abs(value) < 0.05) return 0;                      // gần giữa thì đứng yên
  const speed = minSpeed + (maxSpeed - minSpeed) * Math.abs(value);
  return Math.round(Math.sign(value) * speed);
}

/* ===================== CẦN LÁI ===================== */
const pad = $('pad'), knob = $('knob');

function moveKnob(e) {
  const box = pad.getBoundingClientRect();
  const radius = (box.width - knob.offsetWidth) / 2;
  let dx = e.clientX - (box.left + box.width / 2);
  let dy = e.clientY - (box.top + box.height / 2);

  const dist = Math.hypot(dx, dy);
  if (dist > radius) { dx = dx * radius / dist; dy = dy * radius / dist; }   // giữ núm trong vòng tròn

  knob.style.transform = `translate(-50%, -50%) translate(${dx}px, ${dy}px)`;
  joyX = dx / radius;
  joyY = -dy / radius;          // trên màn hình y tăng xuống dưới, nên đổi dấu
  computeWheels();
}

function releaseKnob() {
  holding = false;
  joyX = joyY = 0;
  knob.style.transform = 'translate(-50%, -50%)';
  computeWheels();
  send('S');                    // buông tay là dừng xe
}

pad.addEventListener('pointerdown', e => { holding = true; pad.setPointerCapture(e.pointerId); moveKnob(e); });
pad.addEventListener('pointermove', e => { if (holding) moveKnob(e); });
pad.addEventListener('pointerup', releaseKnob);
pad.addEventListener('pointercancel', releaseKnob);

// Khi đang giữ cần thì gửi liên tục. Xe không nhận được lệnh quá 0,5 s sẽ tự dừng.
setInterval(() => { if (holding) send(`J${left},${right}`); }, SEND_EVERY_MS);

/* ===================== CÁC NÚT ===================== */
$('connectBtn').onclick = () => characteristic ? characteristic.service.device.gatt.disconnect() : connect();
$('stopBtn').onclick    = () => send('S');
$('lightBtn').onclick   = () => send('D');

// Còi: giữ nút thì kêu, nhả ra thì tắt.
// Đang giữ thì gửi lại 'C' mỗi giây, vì xe tự tắt còi sau 2 giây nếu mất lệnh.
const horn = $('hornBtn');
let hornTimer = null;
horn.addEventListener('pointerdown', () => {
  horn.classList.add('on');
  send('C');
  hornTimer = setInterval(() => send('C'), 1000);
});
function hornOff() {
  if (!hornTimer) return;
  clearInterval(hornTimer);
  hornTimer = null;
  horn.classList.remove('on');
  send('X');
}
horn.addEventListener('pointerup', hornOff);
horn.addEventListener('pointerleave', hornOff);

/* Thanh trượt: hiện giá trị và lưu lại cho lần sau */
for (const [id, outId] of [['maxSpd', 'maxOut'], ['minSpd', 'minOut'], ['trim', 'trimOut']]) {
  const el = $(id);
  const saved = localStorage.getItem(id);
  if (saved !== null) el.value = saved;
  const show = () => { $(outId).textContent = el.value + '%'; localStorage.setItem(id, el.value); computeWheels(); };
  el.oninput = show;
  show();
}

if (!navigator.bluetooth) $('noBle').hidden = false;
</script>
</body>
</html>
